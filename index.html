<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNPSC 20K MCQ Master - ₹99</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
   :root { --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; }
.dark { --bg: #111827; --card: #1f2937; --text: #f9fafb; }
   body { background: var(--bg); color: var(--text); }
.card { background: var(--card); }
.quiz-option.correct { background: #dcfce7; border-color: #16a34a; }
.quiz-option.wrong { background: #fee2e2; border-color: #dc2626; }
.topic-btn.locked { opacity: 0.5; background: #e5e7eb; }
.tag-stage1 { background: #dbeafe; color: #1e40af; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
.tag-stage2 { background: #fed7aa; color: #9a3412; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
.explanation-box { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 8px; margin-top: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="bg-gradient-to-r from-red-600 to-purple-600 text-white text-center py-2 text-xs font-bold">
        50 Free → Login 50 More → ₹99 Full Access
    </div>

    <nav class="card p-3 shadow flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-bold text-purple-700">20K MCQ Master</h1>
        <div class="flex gap-2 items-center">
            <span id="user-name" class="hidden text-xs font-bold"></span>
            <span id="premium-badge" class="hidden px-2 py-0.5 bg-yellow-400 text-white rounded text-xs font-bold">👑 Premium</span>
            <button id="login-btn" class="px-3 py-1 rounded border text-xs font-bold bg-blue-600 text-white">Login</button>
            <button id="logout-btn" class="hidden px-3 py-1 rounded border text-xs font-bold bg-red-600 text-white">Logout</button>
        </div>
    </nav>

    <main class="p-3 max-w-7xl mx-auto">

        <!-- Login Modal -->
        <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="card p-6 rounded-xl max-w-sm w-full text-center">
                <h2 class="font-bold text-xl mb-3">🎁 Unlock 50 More Free Qs</h2>
                <input type="email" id="email-input" placeholder="yourname@gmail.com" class="w-full p-3 rounded border mb-3 text-sm">
                <button id="login-submit-btn" class="w-full bg-red-500 text-white px-6 py-3 rounded-lg text-sm font-bold mb-2">
                    Login with Gmail
                </button>
                <button id="login-close-btn" class="text-xs text-gray-500">Skip</button>
            </div>
        </div>

        <!-- Stage Banner -->
        <div class="card p-3 rounded-xl shadow mb-3 text-center">
            <div id="banner-text" class="text-sm font-bold">🎁 Stage 1: 50 Free Qs | No Login Needed</div>
            <a href="upi://pay?pa=futuristicnandhu-1@okaxis&pn=TNPSC&am=99&cu=INR" id="payment-link"
               class="hidden inline-block mt-2 bg-purple-600 text-white px-6 py-2 rounded-lg text-sm font-bold">
                Unlock All ₹99
            </a>
        </div>

        <!-- Topics -->
        <div class="card p-3 rounded-xl shadow mb-3">
            <h3 class="font-bold text-sm mb-2">Topics</h3>
            <div id="topics-grid" class="grid grid-cols-2 gap-2"></div>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-section" class="card p-4 rounded-xl shadow hidden">
            <div class="bg-purple-50 p-3 rounded-lg mb-3">
                <h3 id="current-topic" class="font-bold text-purple-800 text-base"></h3>
                <span id="stage-tag" class="text-xs"></span>
            </div>

            <div class="border-2 border-dashed p-3 rounded-xl">
                <p id="q-counter" class="text-xs mb-2">1 / 10</p>
                <p id="question-text" class="font-semibold mb-3 text-sm"></p>
                <div id="options-box" class="space-y-2"></div>
                <div id="result-box" class="mt-2 text-sm font-bold text-center"></div>
                <div id="explanation-box" class="hidden explanation-box"></div>
                <button id="next-btn" class="hidden mt-3 w-full bg-purple-600 text-white py-2 rounded-lg text-sm">Next</button>
            </div>
        </div>

    </main>

    <script>
        // ========== CONFIG ==========
        const STAGE1_TOPICS = 5; // First 5 = 50 Qs Free
        const STAGE2_TOPICS = 5; // Next 5 = 50 Qs After Login
        const QS_PER_TOPIC = 10;

        // ========== DATABASE ==========
        const ALL_TOPICS = [
            "1. எழுத்து-பிரித்தல்", "2. சேர்த்தல்", "3. சந்திப்பிழை", "4. குறில்-நெடில்", "5. ல-ள-ழ",
            "6. ன-ண", "7. ர-ற", "8. இன எழுத்து", "9. சுட்டு எழுத்து", "10. வினா எழுத்து",
            "11. ஒருமை-பன்மை", "12. வேர்ச்சொல்", "13. வினைமுற்று", "14. வினையெச்சம்", "15. பெயரெச்சம்"
        ];

        const QUESTIONS = {
            "1. எழுத்து-பிரித்தல்": [
                { q: "நன்மை - பிரித்து எழுதுக", options: ["நன் + மை", "நல் + மை", "நன + மை", "நன்ம + ஐ"], ans: 1, exp: "நல் + மை = நன்மை" },
                { q: "வாழ்க்கை - பிரித்து எழுதுக", options: ["வாழ் + கை", "வாழ + க்கை", "வா + ழ்க்கை", "வாழ்க் + கை"], ans: 0, exp: "வாழ் + கை = வாழ்க்கை" }
            ]
        };

        // ========== STATE ==========
        let currentUser = JSON.parse(localStorage.getItem('tnpsc-user') || 'null');
        let isPremium = localStorage.getItem('tnpsc-premium') === 'true';
        let stage1Count = parseInt(localStorage.getItem('stage1-count') || '0');
        let stage2Count = parseInt(localStorage.getItem('stage2-count') || '0');
        let currentTopic = '';
        let qIndex = 0;
        let currentQs = [];

        // ========== INIT ==========
        document.addEventListener('DOMContentLoaded', function() {
            updateUI();
            loadTopics();
            setupEvents();
        });

        function updateUI() {
            if (currentUser) {
                document.getElementById('user-name').textContent = currentUser.name;
                document.getElementById('user-name').classList.remove('hidden');
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                if (isPremium) document.getElementById('premium-badge').classList.remove('hidden');
            }

            let banner = document.getElementById('banner-text');
            if (isPremium) {
                banner.textContent = '👑 Premium Active | 20,000 Qs Unlocked';
            } else if (currentUser) {
                let remaining = (STAGE2_TOPICS * QS_PER_TOPIC) - stage2Count;
                banner.textContent = `🎁 Stage 2: ${remaining} More Free Qs`;
                document.getElementById('payment-link').classList.remove('hidden');
            } else {
                let remaining = (STAGE1_TOPICS * QS_PER_TOPIC) - stage1Count;
                banner.textContent = `🎁 Stage 1: ${remaining} Free Qs | No Login Needed`;
            }
        }

        function loadTopics() {
            const grid = document.getElementById('topics-grid');
            grid.innerHTML = ALL_TOPICS.map((topic, idx) => {
                let access = getTopicAccess(idx);
                let lockIcon = access === 'locked'? '🔒 ' : '';
                let lockedClass = access === 'locked'? 'locked' : '';
                let stageTag = '';
                if (idx < STAGE1_TOPICS) stageTag = '<span class="tag-stage1">Free</span>';
                else if (idx < STAGE1_TOPICS + STAGE2_TOPICS) stageTag = '<span class="tag-stage2">Login</span>';

                return `<button class="topic-btn px-2 py-2 rounded border text-xs font-bold ${lockedClass}" data-topic="${topic}" data-idx="${idx}">
                    ${lockIcon}${stageTag} ${topic}
                </button>`;
            }).join('');

            document.querySelectorAll('.topic-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    let idx = parseInt(this.dataset.idx);
                    let access = getTopicAccess(idx);
                    if (access === 'locked') {
                        if (!currentUser) showLogin();
                        else showPaymentPrompt();
                        return;
                    }
                    startQuiz(this.dataset.topic);
                });
            });
        }

        function getTopicAccess(idx) {
            if (isPremium) return 'premium';
            if (idx < STAGE1_TOPICS) return 'stage1';
            if (currentUser && idx < STAGE1_TOPICS + STAGE2_TOPICS) return 'stage2';
            return 'locked';
        }

        function setupEvents() {
            document.getElementById('login-btn').addEventListener('click', showLogin);
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('login-submit-btn').addEventListener('click', login);
            document.getElementById('login-close-btn').addEventListener('click', closeLogin);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
        }

        function showLogin() {
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function closeLogin() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function login() {
            const email = document.getElementById('email-input').value.trim();
            if (!email.includes('@')) {
                alert('Valid Email Enter பண்ணுங்க');
                return;
            }
            currentUser = { name: email.split('@')[0], email: email };
            localStorage.setItem('tnpsc-user', JSON.stringify(currentUser));
            localStorage.setItem('stage2-count', '0');
            closeLogin();
            updateUI();
            loadTopics();
            alert('✅ Login Success! இப்போ 50 More Free Qs Attend பண்ணலாம்');
        }

        function logout() {
            localStorage.removeItem('tnpsc-user');
            localStorage.removeItem('tnpsc-premium');
            location.reload();
        }

        function showPaymentPrompt() {
            if (confirm('20,000 Qs Unlock பண்ண ₹99 Pay பண்ணுங்க\n\nOK = Payment\nCancel = Close')) {
                window.location.href = 'upi://pay?pa=futuristicnandhu-1@okaxis&pn=TNPSC&am=99&cu=INR';
                setTimeout(() => {
                    let utr = prompt('Payment UTR Number Enter பண்ணுங்க (Testing: DEMO):');
                    if (utr && utr.length > 3) {
                        localStorage.setItem('tnpsc-premium', 'true');
                        isPremium = true;
                        alert('✅ Premium Unlocked!');
                        location.reload();
                    }
                }, 1000);
            }
        }

        function startQuiz(topic) {
            currentTopic = topic;
            currentQs = QUESTIONS[topic] || [{ q: "Sample Question", options: ["A", "B", "C", "D"], ans: 0, exp: "Sample" }];
            qIndex = 0;
            document.getElementById('quiz-section').classList.remove('hidden');
            document.getElementById('current-topic').textContent = topic;
            showQuestion();
        }

        function showQuestion() {
            let q = currentQs[qIndex];
            if (!q) return;
            document.getElementById('q-counter').textContent = `${qIndex + 1} / ${currentQs.length}`;
            document.getElementById('question-text').textContent = q.q;
            document.getElementById('options-box').innerHTML = q.options.map((opt, i) =>
                `<button class="quiz-option w-full p-2 border rounded text-left text-sm" data-idx="${i}">${opt}</button>`
            ).join('');
            document.getElementById('result-box').textContent = '';
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            document.querySelectorAll('.quiz-option').forEach(btn => {
                btn.addEventListener('click', function() {
                    checkAnswer(parseInt(this.dataset.idx));
                });
            });
        }

        function checkAnswer(selected) {
            let q = currentQs[qIndex];
            let correct = selected === q.ans;
            document.querySelectorAll('.quiz-option').forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.ans) btn.classList.add('correct');
                if (i === selected &&!correct) btn.classList.add('wrong');
            });
            document.getElementById('result-box').textContent = correct? '✅ Correct!' : '❌ Wrong!';
            document.getElementById('explanation-box').textContent = q.exp;
            document.getElementById('explanation-box').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');

            // Update counts
            let topicIdx = ALL_TOPICS.indexOf(currentTopic);
            if (topicIdx < STAGE1_TOPICS) {
                stage1Count++;
                localStorage.setItem('stage1-count', stage1Count);
            } else if (topicIdx < STAGE1_TOPICS + STAGE2_TOPICS) {
                stage2Count++;
                localStorage.setItem('stage2-count', stage2Count);
            }
            updateUI();
        }

        function nextQuestion() {
            qIndex++;
            if (qIndex < currentQs.length) showQuestion();
            else alert('Topic Complete!');
        }
    </script>
</body>
</html>
